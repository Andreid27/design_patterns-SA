<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Authentication Redirect</title>
  </head>
  <body>
    <script>
      if (window.opener) {
        window.opener.postMessage(window.location.href, window.location.origin);
        window.close();
      } else {
        // Fallback for non-popup (e.g. redirect in same tab) - unlikely for authorizeAndExchangeCode
        // but good to have basic handling or just show text
        document.body.innerText =
          "Authentication successful. You can close this window.";
      }
    </script>
  </body>
</html>
